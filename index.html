
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tools Directory</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#333;
}

.card{
background:white;
padding:20px;
margin:15px auto;
max-width:500px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

a{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#007bff;
color:white;
text-decoration:none;
border-radius:5px;
}

a:hover{
background:#0056b3;
}
</style>

<body>

<h1>🤖 AI Tools Directory</h1>
<input
type="text"
placeholder="🔍 Search AI Tools..."
style="width:90%;max-width:500px;padding:12px;margin:20px;border:1px solid #ccc;border-radius:8px;font-size:16px;">
<div class="card">
<h2>ChatGPT</h2>
<p>AI Chat Assistant</p>
<a href="https://chat.openai.com" target="_blank">Open</a>
</div>

<div class="card">
<h2>Google Gemini</h2>
<p>Google AI Assistant</p>
<a href="https://gemini.google.com" target="_blank">Open</a>
</div>

<div class="card">
<h2>Claude AI</h2>
<p>Anthropic AI Assistant</p>
<a href="https://claude.ai" target="_blank">Open</a>

</body>
</html>
